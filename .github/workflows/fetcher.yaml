name: Import Colab artifacts

on:
  workflow_dispatch:
    inputs:
      colab_drive_folder_id:
        description: Google Drive folder ID for the currently running Colab session
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          COLAB_DRIVE_FOLDER_ID: ${{ inputs.colab_drive_folder_id }}
        run: |
          set -euo pipefail
          if [ -z "${GDRIVE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing secret: GDRIVE_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          if [ -z "${COLAB_DRIVE_FOLDER_ID}" ]; then
            echo "Missing workflow input: colab_drive_folder_id" >&2
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Download files from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          COLAB_DRIVE_FOLDER_ID: ${{ inputs.colab_drive_folder_id }}
        run: |
          set -euo pipefail
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/colab-drive-service-account.json"
          mkdir -p "$HOME/.config/rclone"
          printf '[drive]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$RUNNER_TEMP/colab-drive-service-account.json" \
            "$COLAB_DRIVE_FOLDER_ID" > "$HOME/.config/rclone/rclone.conf"
          mkdir -p colab-output
          rclone copy drive: colab-output --create-empty-src-dirs

      - name: Commit imported files
        run: |
          set -euo pipefail
          git add colab-output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Colab artifacts"
          git push
